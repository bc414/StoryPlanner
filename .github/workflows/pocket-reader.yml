name: Pocket Reader (GitHub Pages)

# Publishes tools/StoryPlanner.PocketReader as a static site. The page carries no story data:
# the reader opens .storyplan files the viewer picks on their own device.

on:
  push:
    branches: [master]
    paths:
      - "tools/StoryPlanner.PocketReader/**"
      - "StoryPlanner.Core/**"
      - ".github/workflows/pocket-reader.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish tools/StoryPlanner.PocketReader -c Release -o publish

      - name: Adjust for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/StoryPlanner/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
